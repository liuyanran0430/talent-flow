openapi: 3.1.0
info:
  title: TalentFlow Backend
  description: TalentFlow 招聘后台 API，与前端 talent-flow 对接。功能模块按 OpenAPI tags 划分。
  version: 0.1.0
paths:
  /health:
    get:
      tags:
      - jobs
      summary: 健康检查
      operationId: health_health_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_dict_'
  /:
    get:
      tags:
      - jobs
      summary: 根路径
      operationId: root__get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_dict_'
  /departments:
    get:
      tags:
      - departments
      summary: 部门列表
      operationId: list_departments_departments_get
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_DepartmentOut__'
    post:
      tags:
      - departments
      summary: 新增部门
      operationId: create_department_departments_post
      requestBody:
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentCreate'
        required: true
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_DepartmentOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /departments/{dept_id}:
    get:
      tags:
      - departments
      summary: 部门详情
      operationId: get_department_departments__dept_id__get
      parameters:
      - name: dept_id
        in: path
        required: true
        schema:
          type: integer
          title: Dept Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_DepartmentOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - departments
      summary: 修改部门
      operationId: update_department_departments__dept_id__put
      parameters:
      - name: dept_id
        in: path
        required: true
        schema:
          type: integer
          title: Dept Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/DepartmentUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_DepartmentOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - departments
      summary: 删除部门
      operationId: delete_department_departments__dept_id__delete
      parameters:
      - name: dept_id
        in: path
        required: true
        schema:
          type: integer
          title: Dept Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_NoneType_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs:
    get:
      tags:
      - jobs
      summary: 职位列表
      operationId: list_jobs_jobs_get
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按职位名模糊搜索
          title: Search
        description: 按职位名模糊搜索
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: open/urgent/paused/closed
          title: Status
        description: open/urgent/paused/closed
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_JobWithStats__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - jobs
      summary: 新建职位
      operationId: create_job_jobs_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_JobOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /jobs/{job_id}:
    get:
      tags:
      - jobs
      summary: 职位详情
      operationId: get_job_jobs__job_id__get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_JobWithStats_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - jobs
      summary: 更新职位
      operationId: update_job_jobs__job_id__put
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/JobUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_JobOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - jobs
      summary: 删除职位
      operationId: delete_job_jobs__job_id__delete
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_NoneType_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /requirements/{job_id}/items:
    get:
      tags:
      - requirements
      summary: 职位要求项列表
      operationId: list_items_requirements__job_id__items_get
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_RequirementItemOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - requirements
      summary: 新增要求项
      operationId: create_item_requirements__job_id__items_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementItemCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_RequirementItemOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /requirements/{job_id}/generate:
    post:
      tags:
      - requirements
      summary: 基于职位JD（description）调用LLM生成要求项（仅预览，不落库；确认后经 items/batch 应用）
      operationId: generate_from_jd_requirements__job_id__generate_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_RequirementItemGen__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /requirements/{job_id}/items/batch:
    post:
      tags:
      - requirements
      summary: 批量覆盖写入要求项（AI 生成结果编辑确认后应用，整体覆盖当前职位要求）
      operationId: batch_create_items_requirements__job_id__items_batch_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementBatchCreate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_list_RequirementItemOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /requirements/{job_id}/recalculate:
    post:
      tags:
      - requirements
      summary: 要求配置变化后重算相关候选人：后台重新解析生成匹配建议（jobfits）并按算法参数重算AI得分（matches）
      operationId: recalculate_candidates_requirements__job_id__recalculate_post
      parameters:
      - name: job_id
        in: path
        required: true
        schema:
          type: integer
          title: Job Id
      requestBody:
        content:
          application/json:
            schema:
              anyOf:
              - $ref: '#/components/schemas/RecalculatePayload'
              - type: 'null'
              title: Payload
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_dict_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /requirements/items/{item_id}:
    put:
      tags:
      - requirements
      summary: 更新要求项
      operationId: update_item_requirements_items__item_id__put
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/RequirementItemUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_RequirementItemOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - requirements
      summary: 删除要求项
      operationId: delete_item_requirements_items__item_id__delete
      parameters:
      - name: item_id
        in: path
        required: true
        schema:
          type: integer
          title: Item Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_NoneType_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /candidates:
    get:
      tags:
      - candidates
      summary: 候选人分页列表
      operationId: list_candidates_candidates_get
      parameters:
      - name: search
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          description: 按姓名模糊搜索
          title: Search
        description: 按姓名模糊搜索
      - name: status
        in: query
        required: false
        schema:
          anyOf:
          - type: string
          - type: 'null'
          title: Status
      - name: job_id
        in: query
        required: false
        schema:
          anyOf:
          - type: integer
          - type: 'null'
          description: 按意向职位筛选
          title: Job Id
        description: 按意向职位筛选
      - name: page
        in: query
        required: false
        schema:
          type: integer
          minimum: 1
          default: 1
          title: Page
      - name: page_size
        in: query
        required: false
        schema:
          type: integer
          maximum: 1000
          minimum: 1
          default: 20
          title: Page Size
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_PageResponse_CandidateOut__'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    post:
      tags:
      - candidates
      summary: 新建候选人
      operationId: create_candidate_candidates_post
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateCreate'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CandidateOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /candidates/{candidate_id}:
    get:
      tags:
      - candidates
      summary: 候选人详情
      operationId: get_candidate_candidates__candidate_id__get
      parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: integer
          title: Candidate Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CandidateOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    put:
      tags:
      - candidates
      summary: 更新候选人
      operationId: update_candidate_candidates__candidate_id__put
      parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: integer
          title: Candidate Id
      requestBody:
        required: true
        content:
          application/json:
            schema:
              $ref: '#/components/schemas/CandidateUpdate'
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_CandidateOut_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
    delete:
      tags:
      - candidates
      summary: 删除候选人
      operationId: delete_candidate_candidates__candidate_id__delete
      parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: integer
          title: Candidate Id
      responses:
        '200':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_NoneType_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /resumes/upload:
    post:
      tags:
      - resumes
      summary: 上传简历并新建候选人（内容查重，等待手动开始分析）
      operationId: upload_resume_resumes_upload_post
      parameters:
      - name: name
        in: query
        required: false
        schema:
          type: string
          default: ''
          title: Name
      requestBody:
        required: true
        content:
          multipart/form-data:
            schema:
              $ref: '#/components/schemas/Body_upload_resume_resumes_upload_post'
      responses:
        '201':
          description: Successful Response
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/ApiResponse_UploadResult_'
        '422':
          description: Validation Error
          content:
            application/json:
              schema:
                $ref: '#/components/schemas/HTTPValidationError'
  /resumes/{candidate_id}/analyze:
    post:
      tags:
      - resumes
      summary: 开始解析简历（后台任务：LLM 提取基本信息 + 生成职位匹配建议）
      operationId: analyze_resume_resumes__candidate_id__analyze_post
      parameters:
      - name: candidate_id
        in: path
        required: true
        schema:
          type: integer
          title: Candidate Id
      responses:
        '200':
          description: Successful Response
